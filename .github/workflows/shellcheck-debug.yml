---

name: ShellCheck Debug

on:
workflow_dispatch:

jobs:
shellcheck:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Run ShellCheck
    run: |
      sudo apt-get update
      sudo apt-get install -y shellcheck
      shellcheck --version
      find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -s bash -f gcc
```
